name: ci-unit-coverage

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest coverage pytest-cov

      - name: Run pytest with coverage
      - name: Archive coverage.xml (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ci-unit-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: error
        run: |
          set -euo pipefail
          coverage erase
          coverage run -m pytest -q
          coverage xml -o coverage.xml
          coverage report -m || true

      - name: Upload to Codecov (CI context)
      - name: Debug coverage paths
        run: |
          set -euo pipefail
          echo "PWD=$(pwd)"
          echo "BRANCH=$(git rev-parse --abbrev-ref HEAD)  SHA=$(git rev-parse HEAD)"
          test -f coverage.xml || { echo "coverage.xml missing" >&2; exit 1; }
          echo "--- HEAD of coverage.xml (first 60 lines) ---"
          head -n 60 coverage.xml || true
          echo "--- sample filenames from coverage.xml ---"
          grep -oE "filename=\"[^\"]+\"" coverage.xml | sed -E "s/.*filename=\"(.*)\"/\1/" | head -n 25 || true
          echo "--- any absolute paths? (drive letters or /home/runner) ---"
          grep -E "^[[:space:]]*<class filename=\"([A-Za-z]:\\\\|[A-Za-z]:/|/home/runner/)" -n coverage.xml || true
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: vectorworx/compliance-classifier-prototype
          files: ./coverage.xml
          flags: unit
          name: ci-unit
          verbose: true
          fail_ci_if_error: true
